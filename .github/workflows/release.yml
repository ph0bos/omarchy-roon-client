name: Release

# A release is what the marketplace lists, so the gate is here rather than in a
# checklist someone has to remember.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Tag release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A tag whose version disagrees with the manifest produces a listing that
      # reports the wrong version in the marketplace.
      - name: Tag must match manifest version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(python3 -c "import json;print(json.load(open('manifest.json'))['version'])")
          echo "tag=$tag manifest=$manifest"
          [ "$tag" = "$manifest" ] || { echo "::error::tag v$tag != manifest $manifest"; exit 1; }

      - name: Validate manifest
        run: python3 scripts/validate-manifest.py .

      - name: Tests must pass at the tagged commit
        run: |
          python -m pip install --upgrade pip pytest
          python -m pytest tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Every release is a candidate listing, so the marketplace's own rules run
      # before one is cut rather than after a maintainer rejects it.
      - name: Marketplace listing prerequisites
        run: |
          set -euo pipefail
          repo=$(python3 -c "import json;print(json.load(open('scripts/marketplace-baseline.json'))['repository'])")
          commit=$(python3 -c "import json;print(json.load(open('scripts/marketplace-baseline.json'))['commit'])")
          mkdir -p /tmp/marketplace
          ok=0
          for attempt in 1 2 3; do
            if curl -sSfL --max-time 60 \
                 "https://codeload.github.com/$repo/tar.gz/$commit" -o /tmp/marketplace/rules.tar.gz; then
              ok=1; break
            fi
            sleep $((attempt * 5))
          done
          [ "$ok" = 1 ] || { echo "::error::could not fetch the marketplace rules"; exit 1; }
          tar -xzf /tmp/marketplace/rules.tar.gz -C /tmp/marketplace \
            --strip-components=1 --wildcards '*/scripts/*.mjs'
          node scripts/marketplace-baseline.mjs /tmp/marketplace/scripts .

      - name: Build release notes
        run: |
          set -euo pipefail
          prev=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$prev" ]; then
              echo "## Changes since $prev"; echo
              git log --no-merges --pretty='- %s' "$prev..${GITHUB_REF_NAME}"
            else
              echo "First release."
            fi
            echo
            echo "## Install"; echo
            echo '```bash'
            echo "omarchy plugin add https://github.com/${GITHUB_REPOSITORY}.git"
            echo "omarchy plugin enable $(python3 -c "import json;print(json.load(open('manifest.json'))['id'])")"
            echo '```'
            echo
            echo "Then: \`./bin/omarchy-roon-endpoint install\` and \`doctor\`."
          } > NOTES.md
          cat NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: NOTES.md
          generate_release_notes: false

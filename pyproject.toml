[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Deliberately conservative: errors, undefined names, imports and obvious bugs.
# Style opinions are left out so CI blocks on defects, not on taste.
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path is prepared by _fixtures before the daemon imports

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "backend"]
